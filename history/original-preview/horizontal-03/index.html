<style>@font-face{font-family:NotoSans;src:url('assets/NotoSansSC-VF.ttf');font-weight:100 900}@font-face{font-family:NotoSerif;src:url('assets/NotoSerifSC-VF.ttf');font-weight:200 900}*{box-sizing:border-box}body{margin:0;background:#0b171b;color:#fff1da;font-family:NotoSans,sans-serif;display:grid;place-items:center;min-height:100vh}main{width:100%;display:grid;place-items:center}canvas{max-width:100vw;max-height:86vh;object-fit:contain}nav{display:flex;align-items:center;gap:20px;padding:16px}button{background:#253c3f;border:1px solid #e9c48566;color:#fff1da;padding:8px 22px;border-radius:8px}input{width:52vw;accent-color:#e9c485}span{font-variant-numeric:tabular-nums}</style><main><canvas id="c"></canvas><nav><button id="play">播放</button><input id="scrub" type="range" min="0" max="109.03333333333333" step="0.0166667" value="0"><span id="time">0:00 / 1:49</span></nav></main><script src="runtime_version.js?v=8366a423a35ede09"></script><script src="film.js?v=f916274efc413814"></script><script src="layout.js?v=a743796d7f5e492f"></script><script src="refine.js?v=655cd284cd5ffaf9"></script><script src="direction.js?v=fb188689753c9136"></script><script src="music_sync.js?v=21d15b401ddc32f4"></script><script src="pace.js?v=98eea5320ef9bad7"></script><script>let playing=false,origin=0,anchor=0;const audio=new Audio('audio/score.wav?v=b7c6583dd8bebd80');audio.preload=location.search.includes('offline')?'none':'auto';const btn=document.getElementById('play'),range=document.getElementById('scrub');btn.onclick=()=>{playing=!playing;btn.textContent=playing?'暂停':'播放';if(playing){origin=performance.now();anchor=+range.value;audio.currentTime=anchor;audio.play();requestAnimationFrame(tick)}else audio.pause()};range.oninput=()=>{anchor=+range.value;origin=performance.now();audio.currentTime=anchor;seek(anchor)};function tick(now){if(!playing)return;let t=Math.min(window.END,audio.currentTime);range.value=t;seek(t);document.getElementById('time').textContent=Math.floor(t/60)+':'+S
