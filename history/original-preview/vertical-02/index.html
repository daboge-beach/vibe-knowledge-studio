<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>第二集 · 一勺的变迁</title>
<style>
@font-face{font-family:NotoSans;src:url('baseline/assets/NotoSansSC-VF.ttf');font-weight:100 900}
@font-face{font-family:NotoSerif;src:url('baseline/assets/NotoSerifSC-VF.ttf');font-weight:200 900}
*{box-sizing:border-box}body{margin:0;background:#100e0d;color:#efdfc9;font-family:NotoSans,'Microsoft YaHei',sans-serif;display:grid;place-items:center;min-height:100vh}
main{width:100%;display:grid;place-items:center}canvas{display:block;max-width:100vw;max-height:87vh;object-fit:contain}nav{display:flex;align-items:center;gap:16px;padding:16px;font-size:13px}button,a{background:#30271f;color:#efdfc9;border:1px solid #8a7151;padding:8px 15px;border-radius:6px;text-decoration:none}input{width:35vw;accent-color:#d6b67a}span{font-variant-numeric:tabular-nums}
</style><main><canvas id="c"></canvas><nav><button id="play">播放</button><input id="scrub" type="range" min="0" max="120.7" step="0.033" value="0"><span id="time">0:00 / 2:01</span><a id="switch" href="?mode=vertical">切换竖屏</a></nav></main>
<script src="baseline/engine.js"></script><script src="baseline/episode.js"></script><script src="baseline/people.js"></script><script src="baseline/art.js"></script><script src="baseline/scenes.js"></script><script src="baseline/film.js"></script><script src="pace.js"></script><script src="music_sync.js"></script><script src="portrait_repair.js"></script><script>
let active=false,anchor=0,start=0;const b=document.getElementById('play'),range=document.getElementById('scrub'),score=new Audio('audio/score.wav');score.preload=new URLSearchParams(location.search).has('offline')?'none':'auto';
b.onclick=()=>{active=!active;if(active){start=performance.now();anchor=+range.value;score.currentTime=anchor;score.play().catch(()=>{});requestAnimationFrame(loop)}else{score.pause()}b.textContent=active?'暂停':'播放'};
range.oninput=()=>{anchor=+range.value;start=performance.now();score.currentTime=anchor;seek(anchor)};
function loop(now){if(!active)return;const t=Math.min(window.END,score.currentTime);range.value=t;seek(t);document.getElementById('time').textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+' / 2:01';if(t<window.END)requestAnimationFrame(loop);else{active=false;score.pause();b.textContent='播放'}}
document.getElementById('switch').href='?mode='+(MODE==='vertical'?'horizontal':'vertical');document.getElementById('switch').textContent=MODE==='vertical'?'切换横屏':'切换竖屏';
</script></html>
