<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>不焦虑爸爸 · 横屏重制</title>
<style>@font-face{font-family:NotoSans;src:url('assets/NotoSansSC-VF.ttf');font-weight:100 900}@font-face{font-family:NotoSerif;src:url('assets/NotoSerifSC-VF.ttf');font-weight:200 900}*{box-sizing:border-box}body{margin:0;background:#0b171b;color:#fff1da;font-family:NotoSans,sans-serif;display:grid;place-items:center;min-height:100vh}main{width:100%;display:grid;place-items:center}canvas{max-width:100vw;max-height:86vh;object-fit:contain}nav{display:flex;align-items:center;gap:20px;padding:16px}button{background:#253c3f;border:1px solid #e9c48566;color:#fff1da;padding:8px 22px;border-radius:8px}input{width:52vw;accent-color:#e9c485}span{font-variant-numeric:tabular-nums}</style><main><canvas id="c"></canvas><nav><button id="play">播放</button><input id="scrub" type="range" min="0" max="119.95" step="0.0166667" value="0"><span id="time">0:00 / 1:59</span></nav></main><script src="runtime_version.js?v=75d9d1f18847a2f9"></script><script src="engine.js?v=187658b4988e1b04"></script><script src="art.js?v=bca0bf503760f36a"></script><script src="scenes.js?v=c41c882d316e9a79"></script><script src="film.js?v=5f0e56e8259c8139"></script><script src="layout.js?v=695c8806ad42bcb5"></script><script src="refine.js?v=707c9171f8cf2945"></script><script src="direction.js?v=f4aa6e63aefc2e72"></script><script src="music_sync.js?v=b797e5e872fcc919"></script><script src="pace.js?v=8e7a2dc2c0515745"></script><script>let playing=false,origin=0,anchor=0;const audio=new Audio('audio/score.wav?v=b84220c08f0f89f3');audio.preload=location.search.includes('offline')?'none':'auto';const btn=document.getElementById('play'),range=document.getElementById('scrub');btn.onclick=()=>{playing=!playing;btn.textContent=playing?'暂停':'播放';if(playing){origin=performance.now();anchor=+range.value;audio.currentTime=anchor;audio.play();requestAnimationFrame(tick)}else audio.pause()};range.oninput=()=>{anchor=+range.value;origin=performance.now();audio.currentTime=anchor;seek(anchor)};function tick(now){if(!playing)return;let t=Math.min(window.END,audio.currentTime);range.value=t;seek(t);document.getElementById('time').textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+' / 1:59';if(t<window.END)requestAnimationFrame(tick);else{playing=false;btn.textContent='播放';audio.pause()}}</script></html>
